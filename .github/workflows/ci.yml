# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6.4.1

      # Robolectric downloads its Android framework jars into the Maven repository on first use.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      # AGP installs the missing SDK platform, NDK and CMake on first use (licenses are
      # pre-accepted on GitHub's Ubuntu runners).
      - name: Build both flavors and run unit tests
        run: ./gradlew assembleNetworkDebug assembleLocalDebug test :app:lintNetworkDebug :app:lintLocalDebug --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-reports
          path: "**/build/reports/tests/"
