# SPDX-License-Identifier: GPL-3.0-or-later
# Tagging a release (v<versionName>, e.g. v0.1.0) builds MeaVox Max, signs it with the project's key
# and publishes it to GitHub Releases (#21, ADR 24). MeaVox for Google Play is uploaded by hand (#45).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  meavox-max:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6.4.1

      - name: Check the tag names the app's version
        run: |
          version="$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} doesn't match versionName ${version} in app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      # The repository secrets hold the release key (#45): the keystore as base64, and its passwords and alias.
      - name: Put the release key in place
        env:
          KEYSTORE_BASE64: ${{ secrets.MEAVOX_MAX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::the secret MEAVOX_MAX_KEYSTORE_BASE64 isn't set"
            exit 1
          fi
          keystore="$RUNNER_TEMP/meavox-max.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "MEAVOX_SIGNING_NETWORK_STORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Build MeaVox Max
        env:
          MEAVOX_SIGNING_NETWORK_STORE_PASSWORD: ${{ secrets.MEAVOX_MAX_STORE_PASSWORD }}
          MEAVOX_SIGNING_NETWORK_KEY_ALIAS: ${{ secrets.MEAVOX_MAX_KEY_ALIAS }}
          MEAVOX_SIGNING_NETWORK_KEY_PASSWORD: ${{ secrets.MEAVOX_MAX_KEY_PASSWORD }}
        run: ./gradlew assembleNetworkRelease --stacktrace

      - name: Check it is signed, and name it
        run: |
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          apk=app/build/outputs/apk/network/release/app-network-release.apk
          "$build_tools/apksigner" verify "$apk"
          mkdir -p dist
          cp "$apk" "dist/MeaVox-Max-${VERSION}.apk"
          (cd dist && sha256sum "MeaVox-Max-${VERSION}.apk" > "MeaVox-Max-${VERSION}.apk.sha256")

      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/meavox-max.jks"

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "MeaVox Max ${VERSION}" \
            --notes "MeaVox Max ${VERSION}. Install the APK on Android 10 or later; check it against the .sha256 file."
